name: nafinity
x-runtime: &runtime
  image: nafinity:dev
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: development
  working_dir: /workspace/app
  environment: &environment
    APP_ENV: dev
    APP_URL: http://localhost:${NAFINITY_PORT:-8088}
    DB_DRIVER: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: nafinity
    DB_USERNAME: nafinity
    DB_PASSWORD: ${NAFINITY_DB_PASSWORD:?Copy .env.example to .env and set the database passwords}
  volumes:
    - ./app:/workspace/app
    - ${NAF_SOURCE_ROOT:-../nafphp}:/workspace/packages:ro
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  app:
    <<: *runtime
    ports: ["127.0.0.1:${NAFINITY_PORT:-8088}:8080"]
    depends_on:
      db: {condition: service_healthy}
  candidate:
    image: nafinity:candidate
    profiles: [candidate]
    environment:
      <<: *environment
      APP_ENV: prod
      APP_URL: http://localhost:8090
    ports: ["127.0.0.1:8090:8080"]
    volumes: ["./app/storage:/workspace/app/storage"]
    init: true
    depends_on:
      db: {condition: service_healthy}
  app-test:
    <<: *runtime
    profiles: [test]
    ports: ["127.0.0.1:8089:8080"]
    environment:
      <<: *environment
      APP_ENV: test
      APP_URL: http://localhost:8089
      DB_DATABASE: nafinity_test
    volumes:
      - ./app:/workspace/app
      - ${NAF_SOURCE_ROOT:-../nafphp}:/workspace/packages:ro
      - ./.test-storage:/workspace/app/storage
    depends_on:
      db: {condition: service_healthy}
  worker:
    <<: *runtime
    command: ["php", "vendor/bin/naf", "queue:consume"]
    profiles: [background]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/nafinity-worker-heartbeat') && time()-(int)file_get_contents('/tmp/nafinity-worker-heartbeat')<30 ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      start_period: 15s
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  ticker:
    <<: *runtime
    command: ["php", "vendor/bin/naf", "schedule:ticker"]
    profiles: [background]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/nafinity-ticker-heartbeat') && time()-(int)file_get_contents('/tmp/nafinity-ticker-heartbeat')<30 ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      start_period: 15s
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: nafinity
      MARIADB_USER: nafinity
      MARIADB_PASSWORD: ${NAFINITY_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${NAFINITY_DB_ROOT_PASSWORD:?Set a local root password}
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  postgres:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: nafinity
      POSTGRES_PASSWORD: ${NAFINITY_DB_PASSWORD}
      POSTGRES_DB: nafinity_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nafinity -d nafinity_test"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  database:
