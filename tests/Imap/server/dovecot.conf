dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols {
  imap = yes
}
listen = *
mail_home = /srv/mail/%{user}
mail_driver = maildir
mail_path = ~/mail
mail_uid = vmail
mail_gid = vmail
namespace inbox {
  inbox = yes
  separator = /
}
passdb passwd-file {
  passwd_file_path = /etc/dovecot/passwd
}
ssl = required
ssl_server_cert_file = /certs/cert.pem
ssl_server_key_file = /certs/key.pem
log_path = /dev/stderr
