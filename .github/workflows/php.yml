name: NAF Board

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Validate manifest and supported PHP syntax
        run: |
          composer validate --strict
          find src tests examples -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          find src -name '*.phtml' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Run browser module tests
        run: composer run-script test:js

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: nafphp/board
      # Immutable source revisions keep this host reproducible while dependencies
      # await publication. They are test inputs, never stable Composer aliases.
      - uses: actions/checkout@v7
        with:
          repository: nafphp/nafinity
          ref: d3225bc4ca38a9b6d08edd2c3390b94cee9ccc81
          path: nafinity
      - uses: actions/checkout@v7
        with:
          repository: nafphp/framework
          ref: acf8ccb1e7ecbb1b360775200fa308540b3ea404
          path: nafphp/framework
      - uses: actions/checkout@v7
        with:
          repository: nafphp/database
          ref: 8f38cc8065349ec2e719320d31e1f8937087d832
          path: nafphp/database
      - uses: actions/checkout@v7
        with:
          repository: nafphp/rbac
          ref: 58aa675e4f53f967aea8fc1b1b53fed9aaab96c1
          path: nafphp/rbac
      - uses: actions/checkout@v7
        with:
          repository: nafphp/websocket
          ref: ed2a58d6215e3353b867855760e6a992e4aefb29
          path: nafphp/websocket
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare the disposable Linux host
        working-directory: nafinity
        run: |
          make create-env-file certificates storage-dirs
          mkdir -p work
          chmod -R a+rwX app .test-storage work
          sudo chown 1000:1000 docker/rootfs/etc/nginx/ssl/privkey.pem
          umask 0000
          make build-app composer-install
      - name: Run both databases, HTTP, workers and real Composer extensions
        working-directory: nafinity
        run: |
          set -o pipefail
          umask 0000
          make test 2>&1 | tee integration.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: nafinity/integration.log
      - name: Remove disposable services
        if: always()
        working-directory: nafinity
        run: docker compose --profile test down --volumes
