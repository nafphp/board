name: NAF Board

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Validate manifest and supported PHP syntax
        run: |
          composer validate --strict
          find src tests examples -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          find src -name '*.phtml' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Run browser module tests
        run: composer run-script test:js

