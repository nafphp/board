name: NAF Board

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, ldap, mbstring, pdo_mysql, sodium
          tools: composer
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate the manifest
        run: composer validate --strict
      - name: Install
        run: |
          composer install --no-interaction --no-progress
          npm ci --ignore-scripts
      - name: Check the style
        run: |
          composer style:check
          npm run style:check
      # The suite starts its own MariaDB from tests/compose.yaml.
      - name: Run the suite
        run: composer test
      - name: Run the browser module tests
        run: npm test
