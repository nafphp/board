name: NAF Board

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.5']
        database: ['mariadb:11.4', 'mysql:8.4']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: nafinity_test
          MYSQL_USER: board
          MYSQL_PASSWORD: board
          MYSQL_ROOT_PASSWORD: root-test-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="if command -v mariadb-admin > /dev/null; then mariadb-admin ping -h 127.0.0.1 --silent; else mysqladmin ping -h 127.0.0.1 --silent; fi"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, ldap, mbstring, pdo_mysql, sodium
          tools: composer
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate the manifest
        run: composer validate --strict
      - name: Install
        run: |
          composer install --no-interaction --no-progress
          npm ci --ignore-scripts
      - name: Check the style
        run: |
          composer style:check
          npm run style:check
      # CI supplies each supported database; local runs may start tests/compose.yaml.
      - name: Run the suite
        run: composer test
      - name: Run the browser module tests
        run: npm test
