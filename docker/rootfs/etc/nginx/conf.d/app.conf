server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    root   /workspace/app/public;
    index  index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        same-origin always;
    add_header X-Frame-Options        DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param SCRIPT_FILENAME /workspace/app/public/index.php;
        fastcgi_pass  127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 8080;

    include /tmp/nginx/redirect.conf;
}
