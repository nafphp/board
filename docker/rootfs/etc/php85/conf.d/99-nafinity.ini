expose_php                  = Off
display_errors              = Off
log_errors                  = On
error_log                   = /dev/stderr
memory_limit                = 128M
upload_max_filesize         = 10M
post_max_size               = 12M
max_file_uploads            = 5
variables_order             = EGPCS
date.timezone               = UTC
session.save_path           = /workspace/app/storage/sessions
session.use_strict_mode     = 1
session.cookie_httponly     = 1
session.cookie_samesite     = Lax
opcache.enable              = 1
opcache.validate_timestamps = 0
sendmail_path              = "/usr/bin/msmtp --read-envelope-from -t"
